<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Pipe Pulse Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 800; fill: #38bdf8; letter-spacing: 1px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #94a3b8; line-height: 1.3; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; }
    
    /* Flow Animations */
    .flow-line {
      stroke-dasharray: 6 8;
      animation: flowMove 1.6s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 6 8;
      animation: flowMoveRev 1.6s linear infinite;
    }
    @keyframes flowMove {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowMoveRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 28; }
    }

    /* Pulse Glow */
    .pulse-dot {
      animation: pulseGlow 2s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { r: 4px; opacity: 0.6; }
      100% { r: 7px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    
    .pulse-ring {
      animation: ringExpand 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    @keyframes ringExpand {
      0% { r: 6px; opacity: 0.9; stroke-width: 2px; }
      100% { r: 16px; opacity: 0; stroke-width: 0.5px; }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1100" height="520" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Subtle Industrial Grid Backdrop -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.8">
    <line x1="50" y1="0" x2="50" y2="520"/>
    <line x1="170" y1="0" x2="170" y2="520"/>
    <line x1="290" y1="0" x2="290" y2="520"/>
    <line x1="410" y1="0" x2="410" y2="520"/>
    <line x1="530" y1="0" x2="530" y2="520"/>
    <line x1="650" y1="0" x2="650" y2="520"/>
    <line x1="770" y1="0" x2="770" y2="520"/>
    <line x1="890" y1="0" x2="890" y2="520"/>
    <line x1="1010" y1="0" x2="1010" y2="520"/>
    <line x1="0" y1="80" x2="1100" y2="80"/>
    <line x1="0" y1="180" x2="1100" y2="180"/>
    <line x1="0" y1="280" x2="1100" y2="280"/>
    <line x1="0" y1="380" x2="1100" y2="380"/>
    <line x1="0" y1="460" x2="1100" y2="460"/>
  </g>

  <!-- Outer Neon Border Glow -->
  <rect x="2" y="2" width="1096" height="516" rx="18" fill="none" stroke="url(#pipeGrad)" stroke-width="1.2" opacity="0.5"/>

  <!-- Top Header Title Bar -->
  <g transform="translate(45, 42)">
    <circle cx="16" cy="16" r="16" fill="#2563eb" filter="url(#glow)" opacity="0.8"/>
    <text x="16" y="22" font-size="16" font-family="sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">V</text>
    <text x="44" y="16" class="title" font-size="19" letter-spacing="0.5">VSPL SMES • Real-Time Manufacturing Execution Pipeline</text>
    <text x="44" y="32" class="subtitle">Deterministic Shop Floor Movement, Subcontracting Trips, Conservation of Mass &amp; BSR Custody</text>
    
    <!-- Live Pulse Indicator -->
    <g transform="translate(940, 16)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#10b981" class="pulse-ring"/>
      <circle cx="0" cy="0" r="5" fill="#10b981" filter="url(#dotGlow)"/>
      <text x="14" y="4" class="badge" fill="#34d399">LIVE ENGINE</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTORS (Animated SVGs) ==================== -->
  
  <!-- ROW 1 PIPES: (1) Sales -> (2) Casting -> (3) Planning -> (4) Machining -->
  <path d="M 195 160 L 255 160" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 195 160 L 255 160" fill="none" stroke="#38bdf8" stroke-width="3" class="flow-line"/>

  <path d="M 435 160 L 495 160" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 435 160 L 495 160" fill="none" stroke="#818cf8" stroke-width="3" class="flow-line"/>

  <path d="M 675 160 L 735 160" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 675 160 L 735 160" fill="none" stroke="#a855f7" stroke-width="3" class="flow-line"/>

  <!-- VERTICAL DROP: Machining (4) -> SCM Subcontractor (5) & Inspection (6) -->
  <path d="M 825 215 L 825 265" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 825 215 L 825 265" fill="none" stroke="#06b6d4" stroke-width="3" class="flow-line"/>

  <!-- VENDOR TRIP LOOP (Bi-directional multi-gate trip) -->
  <path d="M 915 315 C 990 315, 990 395, 915 395" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 915 315 C 990 315, 990 395, 915 395" fill="none" stroke="#ec4899" stroke-width="2.5" class="flow-line"/>
  <path d="M 915 395 C 990 395, 990 315, 915 315" fill="none" stroke="#f43f5e" stroke-width="2.5" class="flow-line-reverse" opacity="0.7"/>

  <!-- ROW 2 PIPES (Leftward return flow): (6) Inspection -> (7) MRB -> (8) Packing -> (9) BSR -> (10) Dispatch -->
  <path d="M 735 340 L 675 340" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 735 340 L 675 340" fill="none" stroke="#22c55e" stroke-width="3" class="flow-line-reverse"/>

  <path d="M 495 340 L 435 340" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 495 340 L 435 340" fill="none" stroke="#10b981" stroke-width="3" class="flow-line-reverse"/>

  <path d="M 255 340 L 195 340" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 255 340 L 195 340" fill="none" stroke="#06b6d4" stroke-width="3" class="flow-line-reverse"/>

  <!-- FINAL VERTICAL DROP: BSR (8) -> Dispatch Bay (9) -->
  <path d="M 105 395 L 105 440" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 105 395 L 105 440" fill="none" stroke="#10b981" stroke-width="3" class="flow-line"/>
  <path d="M 105 440 L 255 440" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 105 440 L 255 440" fill="none" stroke="#10b981" stroke-width="3" class="flow-line"/>

  <!-- ==================== STAGE CARDS & NODES ==================== -->

  <!-- STAGE 1: Sales & OAR Intake -->
  <g transform="translate(15, 105)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#38bdf8"/>
    <text x="14" y="24" class="step-num">STAGE 01 • INTAKE</text>
    <text x="14" y="46" class="node-title">Sales Orders &amp; OAR</text>
    <text x="14" y="66" class="node-desc">PO matching, customer part</text>
    <text x="14" y="80" class="node-desc">cross-ref &amp; auto OAR splits.</text>
    <circle cx="156" cy="24" r="8" fill="#0284c7" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#38bdf8"/>
  </g>

  <!-- STAGE 2: Continuous Casting (CC) -->
  <g transform="translate(255, 105)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#6366f1"/>
    <text x="14" y="24" class="step-num" fill="#818cf8">STAGE 02 • MELTING</text>
    <text x="14" y="46" class="node-title">Continuous Casting</text>
    <text x="14" y="66" class="node-desc">Centrifugal bronze melting,</text>
    <text x="14" y="80" class="node-desc">heat ledger, cutting &amp; stock.</text>
    <circle cx="156" cy="24" r="8" fill="#4f46e5" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#818cf8"/>
  </g>

  <!-- STAGE 3: Setup Planning & Release -->
  <g transform="translate(495, 105)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#a855f7"/>
    <text x="14" y="24" class="step-num" fill="#c084fc">STAGE 03 • PPC</text>
    <text x="14" y="46" class="node-title">Setup Planning &amp; WO</text>
    <text x="14" y="66" class="node-desc">Setups, Excel round-trip,</text>
    <text x="14" y="80" class="node-desc">delays, capacity &amp; release.</text>
    <circle cx="156" cy="24" r="8" fill="#9333ea" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#c084fc"/>
  </g>

  <!-- STAGE 4: Machining Gates (F1/F2/F3/SP) -->
  <g transform="translate(735, 105)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#06b6d4"/>
    <text x="14" y="24" class="step-num" fill="#22d3ee">STAGE 04 • SHOP FLOOR</text>
    <text x="14" y="46" class="node-title">Machining Gates</text>
    <text x="14" y="66" class="node-desc">F1 turning, F2 CNC, F3, SP</text>
    <text x="14" y="80" class="node-desc">Mass balance: OK + Scrap.</text>
    <circle cx="156" cy="24" r="8" fill="#0891b2" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#22d3ee"/>
  </g>

  <!-- STAGE 5: SCM Vendor Subcontracting Trips (Center-Right Satellite) -->
  <g transform="translate(735, 285)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#ec4899"/>
    <text x="14" y="24" class="step-num" fill="#f472b6">STAGE 05 • SCM TRIPS</text>
    <text x="14" y="46" class="node-title">Vendor Subcontracting</text>
    <text x="14" y="66" class="node-desc">Send from any gate, DC log,</text>
    <text x="14" y="80" class="node-desc">receive at same/later gate.</text>
    <circle cx="156" cy="24" r="8" fill="#db2777" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#f472b6"/>
  </g>

  <!-- STAGE 6: Final Inspection (FI) & MRB -->
  <g transform="translate(495, 285)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#f59e0b"/>
    <text x="14" y="24" class="step-num" fill="#fbbf24">STAGE 06 • QUALITY</text>
    <text x="14" y="46" class="node-title">Final Inspection &amp; MRB</text>
    <text x="14" y="66" class="node-desc">100% CMM verification,</text>
    <text x="14" y="80" class="node-desc">MRB holding &amp; dispositions.</text>
    <circle cx="156" cy="24" r="8" fill="#d97706" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#fbbf24"/>
  </g>

  <!-- STAGE 7: Packing Bay -->
  <g transform="translate(255, 285)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#14b8a6" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#14b8a6"/>
    <text x="14" y="24" class="step-num" fill="#2dd4bf">STAGE 07 • PACKING</text>
    <text x="14" y="46" class="node-title">Packing Bay</text>
    <text x="14" y="66" class="node-desc">Box &amp; pallet packaging,</text>
    <text x="14" y="80" class="node-desc">immutable PKU-XXXXXX codes.</text>
    <circle cx="156" cy="24" r="8" fill="#0d9488" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#2dd4bf"/>
  </g>

  <!-- STAGE 8: BSR Bonded Storage Room -->
  <g transform="translate(15, 285)" filter="url(#softShadow)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.4"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#8b5cf6"/>
    <text x="14" y="24" class="step-num" fill="#a78bfa">STAGE 08 • WAREHOUSE</text>
    <text x="14" y="46" class="node-title">BSR Bonded Store</text>
    <text x="14" y="66" class="node-desc">PO-Committed Finished Lots</text>
    <text x="14" y="80" class="node-desc">+ Free Excess Buffer Stock.</text>
    <circle cx="156" cy="24" r="8" fill="#7c3aed" opacity="0.3"/>
    <circle cx="156" cy="24" r="3" fill="#a78bfa"/>
  </g>

  <!-- STAGE 9: Dispatch Bay -->
  <g transform="translate(255, 415)" filter="url(#softShadow)">
    <rect width="420" height="75" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4"/>
    <rect x="0" y="0" width="420" height="4" rx="2" fill="#10b981"/>
    <text x="16" y="22" class="step-num" fill="#34d399">STAGE 09 • SHIPMENT GATEKEEPER</text>
    <text x="16" y="44" class="node-title" font-size="14">Dispatch Bay &amp; Commercial Invoicing</text>
    <text x="16" y="62" class="node-desc">Commercial invoice, Delivery Challan (DC), strict over-dispatch gatekeeper &amp; truck gate-out.</text>
    <g transform="translate(370, 36)">
      <circle cx="16" cy="0" r="16" fill="#059669" opacity="0.2"/>
      <circle cx="16" cy="0" r="10" fill="#10b981" filter="url(#dotGlow)"/>
      <text x="16" y="4" font-size="12" fill="#ffffff" text-anchor="middle">✓</text>
    </g>
  </g>

  <!-- ==================== ANIMATED TRAVELLER PULSE PARTICLES ==================== -->
  <!-- Particle 1: Stage 1 -> Stage 2 -->
  <circle r="4" fill="#38bdf8" filter="url(#dotGlow)">
    <animateMotion path="M 195 160 L 255 160" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 2: Stage 2 -> Stage 3 -->
  <circle r="4" fill="#818cf8" filter="url(#dotGlow)">
    <animateMotion path="M 435 160 L 495 160" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Particle 3: Stage 3 -> Stage 4 -->
  <circle r="4" fill="#a855f7" filter="url(#dotGlow)">
    <animateMotion path="M 675 160 L 735 160" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Particle 4: Stage 4 -> Stage 5 (Vendor Trip) -->
  <circle r="4.5" fill="#f43f5e" filter="url(#dotGlow)">
    <animateMotion path="M 825 215 L 825 285" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>

  <!-- Particle 5: Vendor Loop -->
  <circle r="4" fill="#ec4899" filter="url(#dotGlow)">
    <animateMotion path="M 915 315 C 990 315, 990 395, 915 395" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Particle 6: Stage 5 -> Stage 6 (Inspection) -->
  <circle r="4" fill="#fbbf24" filter="url(#dotGlow)">
    <animateMotion path="M 735 340 L 675 340" dur="2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>

  <!-- Particle 7: Stage 6 -> Stage 7 (Packing) -->
  <circle r="4" fill="#2dd4bf" filter="url(#dotGlow)">
    <animateMotion path="M 495 340 L 435 340" dur="2s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- Particle 8: Stage 7 -> Stage 8 (BSR) -->
  <circle r="4" fill="#a78bfa" filter="url(#dotGlow)">
    <animateMotion path="M 255 340 L 195 340" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Particle 9: Stage 8 -> Stage 9 (Dispatch) -->
  <circle r="4.5" fill="#10b981" filter="url(#dotGlow)">
    <animateMotion path="M 105 395 L 105 440 L 255 440" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

</svg>
